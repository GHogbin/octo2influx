---
# octo2influx.py configuration file
#
# Copy this file to config.yaml and replace every placeholder. Never commit
# config.yaml: it contains account identifiers and API tokens.
#
# Settings can be overridden by command-line arguments or environment variables
# prefixed with OCTO2INFLUX_, for example OCTO2INFLUX_TIMEZONE.

influx_database: "octo2influx"
influx_tariff_measurement: "octopus-tariffs"
influx_usage_measurement: "octopus-usage"
# Use http://influx:8181 when running the supplied Docker Compose stack.
influx_url: "http://localhost:8181"
# Create this after starting InfluxDB 3:
#   influxdb3 create token --admin
influx_api_token: "MY_INFLUX_API_TOKEN"

# Generate an Octopus API key at:
# https://octopus.energy/dashboard/developer/
octopus_api_key: "MY_OCTOPUS_API_KEY"

# Consumption streams to retrieve. Remove entries you do not use.
# Find MPAN/MPRN and meter serial values on an Octopus bill or account page.
usage:
  - energy_type: "electricity"
    direction: "import"
    meter_point: "YOUR_ELECTRICITY_MPAN"
    meter_serial: "YOUR_ELECTRICITY_METER_SERIAL"
    unit: "kWh"
  - energy_type: "electricity"
    direction: "export"
    meter_point: "YOUR_EXPORT_MPAN"
    meter_serial: "YOUR_EXPORT_METER_SERIAL"
    unit: "kWh"
  - energy_type: "gas"
    direction: "import"
    meter_point: "YOUR_GAS_MPRN"
    meter_serial: "YOUR_GAS_METER_SERIAL"
    # Octopus generally reports SMETS2 gas meters in m3 and SMETS1 in kWh.
    unit: "m3"

# Tariffs to retrieve. These are representative examples, not a catalogue.
# Keep only tariffs you want to compare and update their product/tariff codes.
#
# The final tariff-code letter is the GSP region. Find yours with:
#   curl --user "{api-key}:" \
#     https://api.octopus.energy/v1/electricity-meter-points/{MPAN}/
#
# Browse current products with:
#   curl --user "{api-key}:" https://api.octopus.energy/v1/products/
tariffs:
  - energy_type: "electricity"
    direction: "import"
    product_code: "FLUX-IMPORT-23-02-14"
    tariff_code: "E-1R-FLUX-IMPORT-23-02-14-C"
    full_name: "Octopus Flux Import"
    display_name: "Octopus Flux Import"
    description: "Example electricity import tariff; replace with your tariff."
  - energy_type: "electricity"
    direction: "export"
    product_code: "FLUX-EXPORT-23-02-14"
    tariff_code: "E-1R-FLUX-EXPORT-23-02-14-C"
    full_name: "Octopus Flux Export"
    display_name: "Octopus Flux Export"
    description: "Example electricity export tariff; replace with your tariff."
  - energy_type: "gas"
    direction: "import"
    product_code: "VAR-22-11-01"
    tariff_code: "G-1R-VAR-22-11-01-C"
    full_name: "Flexible Octopus"
    display_name: "Flexible Octopus"
    description: "Example gas tariff; replace with your tariff."

loglevel: INFO
timezone: "Europe/London"

# Date range. 0 means today. from_days_ago, when set by config or CLI,
# overrides the incremental from_max_days_ago behavior.
from_max_days_ago: 60
to_days_ago: 0

# HTTP requests use a bounded timeout and retry transient failures.
request_timeout_seconds: 30
request_max_retries: 4

# Limit each InfluxDB write request to avoid oversized payloads on backfills.
influx_write_batch_size: 5000

base_url: "https://api.octopus.energy/v1"
price_types:
  "standard-unit-rates": "p/kWh"
  "standing-charges": "p/day"
