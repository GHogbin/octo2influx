services:
  influx:
    image: "influxdb:${INFLUXDB_TAG:-3.11.2-core}"
    restart: unless-stopped
    logging:
        driver: "json-file"
        options:
            max-file: "5"
            max-size: "20m"
    # InfluxDB 3 Core has no env-based bootstrap. After the first start, create
    # an admin token and put it into config.yaml as influx_api_token:
    #   docker compose exec influx influxdb3 create token --admin
    # InfluxDB 3 Core requires the database to be created explicitly:
    #   docker compose exec influx influxdb3 create database octo2influx --token <token>
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
    volumes:
      - influxdb3data:/var/lib/influxdb3
    ports:
      # Bind locally by default. Use the opt-in Traefik configuration below
      # if remote access is required.
      - "127.0.0.1:${INFLUX_PORT:-8181}:8181"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          code=$$(curl --silent --output /dev/null --write-out '%{http_code}'
          http://localhost:8181/ping);
          [ "$$code" = "200" ] || [ "$$code" = "401" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    # --- Traefik integration (optional) ---
    # Serve the InfluxDB 3 API over HTTPS through Traefik. Uncomment the labels
    # and the `networks` block below (see the shared "proxy" network at the
    # bottom of this file). Point octo2influx's `influx_url` at the HTTPS host,
    # e.g. influx_url: "https://influx.example.com". You can drop the local
    # `ports:` mapping above once Traefik fronts it.
    #labels:
    #  - "traefik.enable=true"
    #  - "traefik.docker.network=proxy"
    #  - "traefik.http.routers.octo2influx-influx.rule=Host(`influx.example.com`)"
    #  - "traefik.http.routers.octo2influx-influx.entrypoints=https"
    #  - "traefik.http.routers.octo2influx-influx.tls=true"
    #  - "traefik.http.routers.octo2influx-influx.tls.certresolver=letsencrypt"
    #  - "traefik.http.services.octo2influx-influx.loadbalancer.server.port=8181"
    #networks:
    #  - default
    #  - proxy

  grafana:
    image: "grafana/grafana:${GRAFANA_TAG:-13.0.7}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboard.json:/var/lib/grafana/dashboards/octo2influx.json:ro"
    logging:
        driver: "json-file"
        options:
            max-file: "5"
            max-size: "20m"
    environment:
      #- GF_SECURITY_ADMIN_PASSWORD=
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - INFLUXDB_URL=${GRAFANA_INFLUXDB_URL:-http://influx:8181}
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:-octo2influx}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
      # Use European dates DD/MM, instead of the default US MM/DD
      # Used by graph and other places where we only show small intervals
      - GF_DATE_FORMATS_INTERVAL_HOUR=DD/MM HH:mm
      - GF_DATE_FORMATS_INTERVAL_DAY=DD/MM
      # When served behind a reverse proxy such as Traefik, tell Grafana its
      # public URL (uncomment and match the Host() rule below):
      #- GF_SERVER_ROOT_URL=https://grafana.example.com
    depends_on:
      influx:
        condition: service_healthy
    # --- Traefik integration (optional) ---
    # Expose Grafana through an existing Traefik reverse proxy with automatic
    # TLS. Requires a running Traefik instance attached to the external
    # "proxy" network defined at the bottom of this file. Uncomment the
    # labels and the `networks` block below, then set your own Host() rule.
    # You can drop the local `ports:` mapping above once Traefik fronts it.
    #labels:
    #  - "traefik.enable=true"
    #  - "traefik.docker.network=proxy"
    #  - "traefik.http.routers.octo2influx-grafana.rule=Host(`grafana.example.com`)"
    #  - "traefik.http.routers.octo2influx-grafana.entrypoints=https"
    #  - "traefik.http.routers.octo2influx-grafana.tls=true"
    #  - "traefik.http.routers.octo2influx-grafana.tls.certresolver=letsencrypt"
    #  - "traefik.http.services.octo2influx-grafana.loadbalancer.server.port=3000"
    #networks:
    #  - default
    #  - proxy

  octo2influx:
    build:
      context: ./src
    image: "octo2influx:latest"
    restart: unless-stopped
    init: true
    logging:
        driver: "json-file"
        options:
            max-file: "5"
            max-size: "20m"
    volumes:
      - "./config.yaml:/etc/octo2influx/config.yaml:ro"
    environment:
      FREQ: "1h"
      RETRY_FREQ: "5m"
    depends_on:
      influx:
        condition: service_healthy

# Named volumes for persistent InfluxDB 3 and Grafana data.
volumes:
  influxdb3data:
  grafanadata:

# --- Traefik integration (optional) ---
# Uncomment to reference the external network created/managed by your Traefik
# stack, then attach services to it via their `networks:` block (see grafana).
# Create it once with: docker network create proxy
#networks:
#  proxy:
#    external: true
