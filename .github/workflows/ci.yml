name: CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest -q -m "not integration"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          INFLUXDB_TOKEN: ci-placeholder-token
        run: docker compose -f docker-compose.example.yml config --quiet
      - name: Build image
        run: docker build --tag octo2influx:test src

  integration:
    runs-on: ubuntu-latest
    env:
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Bootstrap InfluxDB
        shell: bash
        run: |
          token="apiv3_$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '{"token":"%s","name":"ci-admin","description":"CI integration token"}\n' \
            "$token" > "$RUNNER_TEMP/influx-admin-token.json"
          chmod 600 "$RUNNER_TEMP/influx-admin-token.json"
          sudo chown 1500:1500 "$RUNNER_TEMP/influx-admin-token.json"

          docker run --detach \
            --name octo2influx-integration-influx \
            --publish 8181:8181 \
            --volume "$RUNNER_TEMP/influx-admin-token.json:/run/secrets/admin-token:ro" \
            influxdb:3.11.2-core \
            serve \
            --node-id=ci \
            --object-store=memory \
            --admin-token-file=/run/secrets/admin-token

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent \
                --header "Authorization: Bearer ${token}" \
                http://localhost:8181/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            docker logs octo2influx-integration-influx
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header "Content-Type: application/json" \
            --data '{"db":"octo2influx_test"}' \
            http://localhost:8181/api/v3/configure/database

          echo "TEST_INFLUX_URL=http://localhost:8181" >> "$GITHUB_ENV"
          echo "TEST_INFLUX_TOKEN=$token" >> "$GITHUB_ENV"
          echo "TEST_INFLUX_DATABASE=octo2influx_test" >> "$GITHUB_ENV"
      - name: Validate Grafana provisioning
        shell: bash
        run: |
          docker run --detach \
            --name octo2influx-integration-grafana \
            --publish 3000:3000 \
            --add-host host.docker.internal:host-gateway \
            --env GF_SECURITY_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD" \
            --env GF_AUTH_ANONYMOUS_ENABLED=false \
            --env INFLUXDB_URL=http://host.docker.internal:8181 \
            --env INFLUXDB_DATABASE="$TEST_INFLUX_DATABASE" \
            --env INFLUXDB_TOKEN="$TEST_INFLUX_TOKEN" \
            --volume "$GITHUB_WORKSPACE/grafana/provisioning:/etc/grafana/provisioning:ro" \
            --volume "$GITHUB_WORKSPACE/grafana/dashboard.json:/var/lib/grafana/dashboards/octo2influx.json:ro" \
            --volume "$GITHUB_WORKSPACE/grafana/historical-dashboard.json:/var/lib/grafana/dashboards/octo2influx-history.json:ro" \
            --volume "$GITHUB_WORKSPACE/grafana/solar-planning-dashboard.json:/var/lib/grafana/dashboards/octo2influx-solar-planning.json:ro" \
            grafana/grafana:13.0.7

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health \
                >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            docker logs octo2influx-integration-grafana
            exit 1
          fi

          curl --fail --silent --show-error \
            --user "admin:${GRAFANA_ADMIN_PASSWORD}" \
            "http://localhost:3000/api/search?type=dash-db" |
            python -c '
          import json, sys
          titles = {item["title"] for item in json.load(sys.stdin)}
          expected = {
              "octo2influx — Overview",
              "octo2influx — Historical Analysis",
              "octo2influx — Solar Planning",
          }
          missing = expected - titles
          assert not missing, f"Missing provisioned dashboards: {missing}"
          '

          curl --fail --silent --show-error \
            --user "admin:${GRAFANA_ADMIN_PASSWORD}" \
            http://localhost:3000/api/datasources/uid/octo2influx-influxdb/health |
            python -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result.get("status") == "OK", result
          '
      - name: Run InfluxDB integration tests
        run: python -m pytest -q -m integration
      - name: Show InfluxDB logs
        if: failure()
        run: docker logs octo2influx-integration-influx
      - name: Show Grafana logs
        if: failure()
        run: docker logs octo2influx-integration-grafana
